<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ============================================================
         Primary SEO
         ============================================================ -->
    <title>DegenCore — Bonding Curve Launchpad on Ethereum</title>
    <meta
      name="description"
      content="DegenCore is a fair-launch bonding curve launchpad on Ethereum. Launch, trade, and graduate tokens with no presale, no team allocation, and instant liquidity."
    />
    <meta
      name="keywords"
      content="DegenCore, bonding curve, launchpad, Ethereum, fair launch, token launch, memecoin launchpad, DeFi, BOT"
    />
    <meta name="author" content="DegenCore" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#C6F135" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Canonical — update domain once final -->
    <link rel="canonical" href="https://DegenCore.fun/" />

    <!-- ============================================================
         Open Graph (Facebook, LinkedIn, Discord, Telegram previews)
         ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DegenCore" />
    <meta property="og:title" content="DegenCore — Bonding Curve Launchpad on Ethereum" />
    <meta
      property="og:description"
      content="Fair-launch tokens on a bonding curve. Launch, trade, and graduate on Ethereum — no presale, no team allocation, liquidity burned at graduation."
    />
    <meta property="og:url" content="https://DegenCore.fun/" />
    <meta property="og:image" content="https://DegenCore.fun/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://DegenCore.fun/og-image.jpg" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DegenCore — Bonding Curve Launchpad on Ethereum" />
    <meta property="og:locale" content="en_US" />

    <!-- ============================================================
         Twitter / X Card
         Handle matches the JSON-LD `sameAs` entry below — keep these two
         in sync if the official handle ever changes.
         ============================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@DegenCoredotfun" />
    <meta name="twitter:creator" content="@DegenCoredotfun" />
    <meta name="twitter:title" content="DegenCore — Bonding Curve Launchpad on Ethereum" />
    <meta
      name="twitter:description"
      content="Fair-launch tokens on a bonding curve. Launch, trade, and graduate on Ethereum."
    />
    <meta name="twitter:image" content="https://DegenCore.fun/og-image.jpg" />
    <meta name="twitter:image:alt" content="DegenCore — Bonding Curve Launchpad on Ethereum" />

    <!-- ============================================================
         Favicons
         `favicon.ico` is genuinely an ICO file — its `type` must be
         "image/x-icon" (or omitted), not "image/svg+xml". If a real SVG
         favicon exists, add it as its own separate <link>, e.g.:
           <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
         placed BEFORE the .ico fallback so SVG-capable browsers prefer it.
         ============================================================ -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#C6F135" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="DegenCore" />
    <meta name="application-name" content="DegenCore" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ============================================================
         Fonts — preconnect for the handshake, preload the actual
         stylesheet so text doesn't wait on a second round-trip before
         the font CSS even starts downloading.
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- ============================================================
         Structured Data — WebSite + Organization
         ============================================================ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://DegenCore.fun/#website",
            "url": "https://DegenCore.fun/",
            "name": "DegenCore",
            "description": "Bonding curve launchpad on Ethereum.",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://DegenCore.fun/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://DegenCore.fun/#organization",
            "name": "DegenCore",
            "url": "https://DegenCore.fun/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://DegenCore.fun/og-image.jpg",
              "width": 1200,
              "height": 630
            },
            "sameAs": [
              "https://x.com/DegenCoredotfun",
              "https://t.me/DegenCorelaunchpad"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
